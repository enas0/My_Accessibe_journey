<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Accessible Journey — Login</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #dcdcdc;
      --button-bg: #000000;
      --button-text: #ffffff;
      --button-hover: #222222;
      --focus: #1a73e8;
      --link: #1a73e8;
      --link-hover: #0d5bd7;
      --form-width: 420px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.5;
    }

    /* Layout */
    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    /* Left column */
    .left {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      position: relative;
    }

    .brand {
      position: absolute;
      top: 24px;
      left: 32px;
      font-weight: 600;
      color: var(--muted);
    }

    .card {
      width: 100%;
      max-width: var(--form-width);
    }

    .title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .form {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .label {
      font-size: 14px;
      color: var(--text);
    }

    .input {
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      color: var(--text);
    }

    .input::placeholder { color: #9a9a9a; }
    .input:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(26,115,232,0.3);
      outline: none;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      height: 46px;
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: var(--button-bg);
      color: var(--button-text);
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: var(--button-hover); }

    .link {
      color: var(--link);
      font-size: 14px;
      text-decoration: none;
    }
    .link:hover { color: var(--link-hover); text-decoration: underline; }

    /* Right column */
    .right {
      position: relative;
      overflow: hidden;
    }

    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .go-back {
      position: absolute;
      top: 20px;
      right: 20px;
      height: 42px;
      padding: 0 16px;
      border: none;
      border-radius: 10px;
      background: var(--button-bg);
      color: var(--button-text);
      font-weight: 600;
      cursor: pointer;
    }
    .go-back:hover { background: var(--button-hover); }

    /* Responsive */
    @media (max-width: 960px) {
      .page { grid-template-columns: 1fr; }
      .right { order: -1; height: 42vh; }
      .photo { height: 100%; }
      .left { padding-top: 24px; }
      .brand { position: static; margin-bottom: 12px; }
      .card { max-width: 520px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- Left column -->
    <section class="left">
      <div class="brand">My Accessible Journey</div>
      <div class="card">
        <h1 class="title">Log In</h1>
        <form class="form" action="#" method="post">
          <div class="field">
            <label class="label" for="email">Email</label>
            <input class="input" id="email" name="email" type="email" placeholder="Value" required />
          </div>
          <div class="field">
            <label class="label" for="password">Password</label>
            <input class="input" id="password" name="password" type="password" placeholder="Value" required />
          </div>
          <div class="actions">
            <button type="submit" class="btn">Log In</button>
            <a href="#" class="link">Forgot password?</a>
          </div>
        </form>
      </div>
    </section>

    <!-- Right column -->
    <aside class="right">
      <img class="photo" src="img/Vector2.png" alt="Inclusive travel photograph" />
      <button class="go-back" type="button" onclick="history.back()">GO BACK</button>
    </aside>
  </main>
</body>
</html>
