<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Traveler's Community — My Accessible Journey</title>
<style>
  :root{
    --bg:#fafafa; --muted:#6b7280; --accent:#111827; --card:#ffffff; --tag-bg:#e6f0ff;
    --container:1150px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    color:var(--accent); background:var(--bg); -webkit-font-smoothing:antialiased;
  }

  /* Topbar */
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 48px}
  .brand{font-weight:700}
  .nav{display:flex;gap:18px;align-items:center}
  .nav a{color:var(--muted);text-decoration:none;font-size:14px}
  .back{background:#000;color:#fff;border:none;padding:8px 12px;border-radius:8px}

  /* Layout */
  .container{max-width:var(--container);margin:0 auto;padding:24px}
  .hero{display:flex;gap:24px;align-items:center;margin-top:12px}
  .hero-left{flex:1}
  .hero-right{width:420px}
  h1{font-size:48px;margin:0 0 12px}
  .subtitle{color:var(--muted);margin-bottom:18px}
  .create-btn{background:#111827;color:#fff;padding:14px 22px;border-radius:8px;border:none;cursor:pointer}

  .hero-image{width:100%;height:260px;object-fit:cover;border-radius:14px}

  .section-title{font-size:28px;margin:36px 0}

  /* Grid of cards */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .card{background:var(--card);border-radius:12px;box-shadow:0 6px 12px rgba(15,23,42,0.06);overflow:hidden;display:flex;flex-direction:column}
  .card-image{width:100%;height:140px;object-fit:cover}
  .card-body{padding:16px;flex:1;display:flex;flex-direction:column}
  .card h3{margin:0 0 6px}
  .muted{color:var(--muted)}
  .meta{list-style:none;padding:0;margin:8px 0 12px;color:var(--muted);font-size:14px}
  .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tag{background:var(--tag-bg);padding:6px 10px;border-radius:999px;font-size:13px}
  .card-actions{display:flex;justify-content:flex-start;margin-top:auto}
  .join-btn{background:#111827;color:#fff;padding:10px 16px;border-radius:8px;border:none;cursor:pointer}

  footer.footer{padding:36px;text-align:center;color:var(--muted);margin-top:36px;border-top:1px solid #eee}

  /* Modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(16,24,40,0.6);display:none;align-items:center;justify-content:center;z-index:60;
  }
  .modal-overlay.open{display:flex}
  .modal{
    background:var(--card);width:920px;max-width:95%;max-height:90vh;overflow:auto;border-radius:12px;box-shadow:0 20px 50px rgba(2,6,23,0.6);padding:18px;
  }
  .modal-header{display:flex;align-items:center;justify-content:space-between}
  .icon-btn{background:transparent;border:none;font-size:18px;cursor:pointer}
  .modal-content{display:flex;gap:18px;margin-top:12px}
  .modal-image{width:44%;height:240px;object-fit:cover;border-radius:8px}
  .modal-details{flex:1}
  .modal-details h4{margin:12px 0 6px}
  .modal-actions{display:flex;gap:12px;margin-top:18px}
  .confirm-btn{background:#111827;color:#fff;padding:10px 14px;border-radius:8px;border:none;cursor:pointer}
  .cancel-btn{background:#efefef;border-radius:8px;padding:10px 14px;border:none;cursor:pointer}

  /* small screens */
  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .hero{flex-direction:column}
    .hero-right{width:100%}
    .modal-content{flex-direction:column}
    .modal-image{width:100%;height:220px}
  }
  @media (max-width:600px){
    .grid{grid-template-columns:1fr}
    h1{font-size:34px}
  }
</style>
</head>
<body>

  <header class="topbar" aria-hidden="false">
    <div class="brand">My Accessible Journey</div>
    <nav class="nav" aria-label="Main navigation">
      <a href="#">Home</a>
      <a href="#">Map</a>
      <a href="#">Travel planning</a>
      <a href="#">3d model</a>
      <button class="back">back</button>
    </nav>
  </header>

  <main class="container" id="main">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-left">
        <h1 id="hero-title">Traveler's Community</h1>
        <p class="subtitle">Join group trips or create your own adventure</p>
        <button class="create-btn" type="button">+ Create Trip</button>
      </div>
      <div class="hero-right" aria-hidden="true">
        <img src="https://images.unsplash.com/photo-1508264165352-c2b5b8e08f7b?w=1200&q=80&auto=format&fit=crop" alt="Group around campfire" class="hero-image" />
      </div>
    </section>

    <h2 class="section-title">Ready-to-Go Adventures</h2>

    <section class="grid" id="trips-grid" aria-live="polite">
      <!-- cards will be injected by JS -->
    </section>

    <footer class="footer" role="contentinfo">
      © My Accessible Journey
    </footer>
  </main>

  <!-- Modal (hidden until open) -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle">
    <div class="modal" id="modal" tabindex="-1">
      <header class="modal-header">
        <h3 id="modalTitle">Trip title</h3>
        <button class="icon-btn" id="closeBtn" aria-label="Close dialog">✕</button>
      </header>

      <div class="modal-content">
        <img id="modalImage" class="modal-image" src="" alt="Trip preview" />
        <div class="modal-details">
          <p id="modalShort" class="muted"></p>
          <ul id="modalMeta" class="meta"></ul>
          <p id="modalDescription"></p>

          <div class="tags" id="modalTags" style="margin-top:8px"></div>

          <div class="extra" id="modalExtras">
            <h4>Itinerary</h4>
            <ol id="modalItinerary"></ol>

            <h4>What's included</h4>
            <ul id="modalIncludes"></ul>
          </div>

          <div class="modal-actions">
            <button class="confirm-btn" id="confirmJoin">Confirm Join</button>
            <button class="cancel-btn" id="cancelJoin">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/* Sample trips data */
const trips = [
  {
    id: 't1',
    title: 'Dead Sea Relaxation Retreat',
    short: 'Wellness weekend with accessible spa facilities',
    date: 'Nov 22-23, 2025',
    location: 'Dead Sea',
    organizer: 'Sarah M.',
    image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=80&auto=format&fit=crop',
    accessibility: ['Visual', 'Hearing', 'Physical'],
    description: 'Join a relaxed weekend at the Dead Sea with accessible accommodations, guided low-impact hikes, accessible spa treatments and mindful group activities.',
    itinerary: ['Arrival & welcome', 'Accessible spa & relaxation', 'Guided low-impact hike', 'Departure'],
    includes: ['Transport from Amman', '2 nights hotel (accessible room)', 'Spa session', 'Guided activities']
  },
  {
    id: 't2',
    title: 'Petra Cultural Weekend',
    short: 'Explore Petra with accessibility-minded guides',
    date: 'Dec 6-8, 2025',
    location: 'Petra',
    organizer: 'Omar A.',
    image: 'https://images.unsplash.com/photo-1526481280698-8a5b9f7b6d59?w=1200&q=80&auto=format&fit=crop',
    accessibility: ['Visual', 'Hearing'],
    description: 'A guided experience of Petra focusing on access and sensory-friendly routes.',
    itinerary: ['Arrival & cultural orientation', 'Guided Petra route (adapted)', 'Local cuisine tasting', 'Departure'],
    includes: ['Meals', 'Guide', 'Transport']
  },
  {
    id: 't3',
    title: 'Ancient Theaters & Heritage',
    short: 'Accessible visits to Roman theatres and ruins',
    date: 'Jan 10-11, 2026',
    location: 'Jerash',
    organizer: 'Khaled R.',
    image: 'https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=1200&q=80&auto=format&fit=crop',
    accessibility: ['Physical', 'Visual'],
    description: 'Discover ancient theatres with adapted routes and quiet meeting points.',
    itinerary: ['Guided tour of theatre', 'Photography session', 'Local food tasting', 'Departure'],
    includes: ['Transport', 'Entrance fees', 'Guide']
  }
];

/* Render cards */
const grid = document.getElementById('trips-grid');

trips.forEach(trip => {
  const article = document.createElement('article');
  article.className = 'card';
  article.innerHTML = `
    <img class="card-image" src="${trip.image}" alt="${escapeHtml(trip.title)} image" />
    <div class="card-body">
      <h3>${escapeHtml(trip.title)}</h3>
      <p class="muted">${escapeHtml(trip.short)}</p>
      <ul class="meta">
        <li>• ${escapeHtml(trip.date)}</li>
        <li>• ${escapeHtml(trip.location)}</li>
        <li>• Organized by ${escapeHtml(trip.organizer)}</li>
      </ul>
      <div class="tags">
        ${trip.accessibility.map(a => `<span class="tag">${escapeHtml(a)}</span>`).join('')}
      </div>
      <div class="card-actions">
        <button class="join-btn" data-trip-id="${trip.id}">Join community</button>
      </div>
    </div>
  `;
  grid.appendChild(article);
});

/* Modal logic & accessibility: focus trap, restore focus, keyboard */
const modalOverlay = document.getElementById('modalOverlay');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalImage = document.getElementById('modalImage');
const modalShort = document.getElementById('modalShort');
const modalMeta = document.getElementById('modalMeta');
const modalDescription = document.getElementById('modalDescription');
const modalTags = document.getElementById('modalTags');
const modalItinerary = document.getElementById('modalItinerary');
const modalIncludes = document.getElementById('modalIncludes');
const confirmJoin = document.getElementById('confirmJoin');
const cancelJoin = document.getElementById('cancelJoin');
const closeBtn = document.getElementById('closeBtn');

let activeTrigger = null; // element that opened modal
let currentTrip = null;

grid.addEventListener('click', (e) => {
  const btn = e.target.closest('button.join-btn');
  if (!btn) return;
  const id = btn.dataset.tripId;
  openModal(id, btn);
});

closeBtn.addEventListener('click', closeModal);
cancelJoin.addEventListener('click', closeModal);

confirmJoin.addEventListener('click', async () => {
  confirmJoin.disabled = true;
  confirmJoin.textContent = 'Joining...';
  // simulate API call
  await new Promise(r => setTimeout(r, 900));
  confirmJoin.textContent = 'Joined ✓';
  setTimeout(() => {
    closeModal();
    // optionally show a brief toast / message here
  }, 700);
});

/* open modal and populate */
function openModal(id, trigger) {
  const trip = trips.find(t => t.id === id);
  if (!trip) return;
  currentTrip = trip;
  activeTrigger = trigger;

  modalTitle.textContent = trip.title;
  modalImage.src = trip.image;
  modalImage.alt = `${trip.title} preview`;
  modalShort.textContent = trip.short;

  modalMeta.innerHTML = `
    <li><strong>Date:</strong> ${escapeHtml(trip.date)}</li>
    <li><strong>Location:</strong> ${escapeHtml(trip.location)}</li>
    <li><strong>Organizer:</strong> ${escapeHtml(trip.organizer)}</li>
  `;

  modalDescription.textContent = trip.description;

  modalTags.innerHTML = trip.accessibility.map(a => `<span class="tag">${escapeHtml(a)}</span>`).join('');

  modalItinerary.innerHTML = trip.itinerary.map(i => `<li>${escapeHtml(i)}</li>`).join('');
  modalIncludes.innerHTML = trip.includes.map(i => `<li>${escapeHtml(i)}</li>`).join('');

  confirmJoin.disabled = false;
  confirmJoin.textContent = 'Confirm Join';

  // show modal
  modalOverlay.classList.add('open');
  modalOverlay.setAttribute('aria-hidden', 'false');

  // focus management
  previouslyFocused = document.activeElement;
  modal.focus();

  // start trapping focus
  document.addEventListener('focus', focusTrap, true);
  document.addEventListener('keydown', onKeyDown);
}

/* close modal */
function closeModal() {
  modalOverlay.classList.remove('open');
  modalOverlay.setAttribute('aria-hidden', 'true');
  currentTrip = null;
  document.removeEventListener('focus', focusTrap, true);
  document.removeEventListener('keydown', onKeyDown);
  // restore focus to the button that opened the modal
  try { activeTrigger && activeTrigger.focus(); } catch(e){}
}

/* focus trap: keep focus inside modal */
function focusTrap(e) {
  if (!modalOverlay.classList.contains('open')) return;
  if (modal.contains(e.target)) return;
  e.stopPropagation();
  modal.focus();
}

/* keyboard handlers */
function onKeyDown(e) {
  if (e.key === 'Escape') {
    e.preventDefault();
    closeModal();
    return;
  }
  if (e.key === 'Tab') {
    // simple focusable elements list
    const focusable = modal.querySelectorAll('button, a, input, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusable.length === 0) {
      e.preventDefault();
      modal.focus();
      return;
    }
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  }
}

/* click outside modal to close */
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});

/* Utility: escape user text for HTML insertion */
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, function (m) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

/* small enhancement: keyboard open via Enter on card buttons */
grid.addEventListener('keydown', (e) => {
  const btn = e.target.closest('button.join-btn');
  if (btn && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    btn.click();
  }
});
</script>
</body>
</html>
