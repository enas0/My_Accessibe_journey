<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Accessible Journey — Sign Up</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #666666;
      --border: #dcdcdc;
      --button-bg: #000000;
      --button-text: #ffffff;
      --button-hover: #222222;
      --focus: #1a73e8;
      --form-width: 420px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.5;
    }

    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
    }

    .left {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
      position: relative;
    }

    .card {
      width: 100%;
      max-width: var(--form-width);
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .form {
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 14px;
      color: var(--text);
    }

    input, textarea {
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      color: var(--text);
    }

    textarea {
      height: 100px;
      resize: vertical;
      padding-top: 10px;
    }

    input::placeholder,
    textarea::placeholder {
      color: #999;
    }

    input:focus,
    textarea:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(26,115,232,0.3);
      outline: none;
    }

    .actions {
      margin-top: 10px;
    }

    .btn {
      height: 46px;
      padding: 0 18px;
      border: none;
      border-radius: 10px;
      background: var(--button-bg);
      color: var(--button-text);
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .btn:hover {
      background: var(--button-hover);
    }

    .right {
      position: relative;
      overflow: hidden;
    }

    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .go-back {
      position: absolute;
      top: 20px;
      right: 20px;
      height: 42px;
      padding: 0 16px;
      border: none;
      border-radius: 10px;
      background: var(--button-bg);
      color: var(--button-text);
      font-weight: 600;
      cursor: pointer;
      z-index: 1;
    }

    .go-back:hover {
      background: var(--button-hover);
    }

    @media (max-width: 960px) {
      .page { grid-template-columns: 1fr; }
      .right { order: -1; height: 42vh; }
      .photo { height: 100%; }
      .left { padding-top: 24px; }
      .card { max-width: 520px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- Left column: Sign Up form -->
    <section class="left">
      <div class="card">
        <h1 class="title">Sign Up</h1>
       <form class="form" action="#" method="post">
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
    <div class="field">
      <label for="firstName">First name</label>
      <input id="firstName" name="firstName" type="text" placeholder="Jane" required />
    </div>
    <div class="field">
      <label for="lastName">Last name</label>
      <input id="lastName" name="lastName" type="text" placeholder="Smitherton" required />
    </div>
  </div>

  <div class="field">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" placeholder="email@janesfakedomain.net" required />
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="Enter your password" required />
  </div>

  <div class="field">
    <label for="activities">Your activities</label>
    <textarea id="activities" name="activities" placeholder="Enter your question or message" ></textarea>
  </div>

  <div class="actions">
    <button type="submit" class="btn">Sign Up Now</button>
  </div>
</form>

      </div>
    </section>

    <!-- Right column: desert photo -->
    <aside class="right">
      <img class="photo" src="singup.jpg" alt="Desert adventure photo" />
      <button class="go-back" type="button" onclick="history.back()">GO BACK</button>
    </aside>
  </main>
</body>
</html>
